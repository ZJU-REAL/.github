name: Refresh star count

on:
  schedule:
    - cron: '17 3 * * *'   # daily, 11:17 Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/stars.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- profile/assets/stars.json; then
            echo "No change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/assets/stars.json
            git commit -m "Refresh star count"
            git push
          fi
